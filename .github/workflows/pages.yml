name: Publish webGameLab
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: webgamelab-pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    env:
      SCENE: scenes/002-egyptian-pyramids
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore repaired models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/giza-models
          key: giza-r1-${{ hashFiles('scenes/002-egyptian-pyramids/build/repair_model.py', 'scenes/002-egyptian-pyramids/build/web_model.py') }}
      - name: Prepare exhibition assets
        id: models
        env:
          WGL005_STANDING_SOURCE: ${{ secrets.WGL005_STANDING_SOURCE }}
          WGL005_RECUMBENT_SOURCE: ${{ secrets.WGL005_RECUMBENT_SOURCE }}
        run: python3 "$SCENE/build/fetch_models.py" "$RUNNER_TEMP/giza-models" --raw "$RUNNER_TEMP/giza-source"
      - name: Repair bootstrap models
        if: steps.models.outputs.rebuild != ''
        env:
          MODELS: ${{ steps.models.outputs.rebuild }}
        run: |
          package_url='https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz'
          archive="$RUNNER_TEMP/blender.tar.xz"
          curl -fsSL --retry 2 --max-time 240 "$package_url" -o "$archive"
          echo "975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$archive" --strip-components=1 -C "$RUNNER_TEMP/blender"
          python3 -m venv "$RUNNER_TEMP/model-py"
          "$RUNNER_TEMP/model-py/bin/python" -m pip install --disable-pip-version-check Pillow==11.3.0
          for kind in $MODELS; do
            "$RUNNER_TEMP/blender/blender" -b -t 2 --python-exit-code 1 --python "$SCENE/build/repair_model.py" -- "$kind" "$RUNNER_TEMP/giza-source/$kind.glb" "$RUNNER_TEMP/$kind.glb"
            "$RUNNER_TEMP/model-py/bin/python" "$SCENE/build/web_model.py" "$kind" "$RUNNER_TEMP/$kind.glb" "$RUNNER_TEMP/giza-models/$kind-r1.glb"
          done
      - name: Assemble static site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/site/$SCENE/models"
          cp "$RUNNER_TEMP/giza-models/"*-r1.glb "$RUNNER_TEMP/site/$SCENE/models/"
          cd "$RUNNER_TEMP/site/scenes"
          cp -a 001-cologne-cathedral 003-cologne-cathedral
          cp -a 002-egyptian-pyramids 005-giza-anubis
          cp -a 003-howls-moving-castle 006-howls-moving-castle
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v4
